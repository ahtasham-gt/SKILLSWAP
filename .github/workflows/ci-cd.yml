name: CI/CD Pipeline - Build, Push and Deploy

on:
  push:
    branches: ["main"]

jobs:

  build_and_push:
    name: Build React → Docker → Push to DockerHub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies & Build
        run: |
          npm install
          npm run build

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USER }}/${{ secrets.IMAGE_NAME }}:latest
          platforms: linux/amd64

  deploy:
    name: Deploy to EC2 via Ansible
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > ec2key.pem
          chmod 600 ec2key.pem

      - name: Add EC2 Host to Known Hosts
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: SSH → Run Deployment Script on EC2
        run: |
          ssh -i ec2key.pem ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            set -e

            # Pull latest repo
            if [ ! -d "skillswap" ]; then
              git clone https://github.com/${GITHUB_REPOSITORY}.git skillswap
            else
              cd skillswap && git pull && cd ..
            fi

            # Navigate into the repo
            cd skillswap

            # Run Ansible to install minikube + deploy app
            ansible-playbook -i ansible/inventory.ini ansible/playbooks/setup-minikube.yml
            ansible-playbook -i ansible/inventory.ini ansible/playbooks/deploy-k8s.yml
          EOF
